# Local production-shaped stack.
#
#   docker compose up -d db     # just Postgres, for `npm run dev`
#   docker compose --profile full up --build
#
# The app image serves the API and the built frontend from one origin, so
# there is no separate web container and no CORS to configure.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicequery
      POSTGRES_PASSWORD: voicequery
      POSTGRES_DB: voicequery
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voicequery -d voicequery']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '8787'
      DATABASE_URL: postgres://voicequery:voicequery@db:5432/voicequery
      SESSION_SECRET: ${SESSION_SECRET:?generate one - see .env.example}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Same origin, so CORS is unused. Kept for a split deployment.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8787}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CREDIT_PACKAGES: ${CREDIT_PACKAGES:-[]}
      DATA_DIR: /data
    volumes:
      # DuckDB dataset files. Ephemeral by design, but must survive a restart.
      - datasets:/data
    ports:
      - '8787:8787'

volumes:
  pgdata:
  datasets:
